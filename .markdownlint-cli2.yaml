# Markdownlint config — relaxed rules; vendored skill docs are ignored.
config:
  MD013: false
  MD036: false
  MD033: false
  MD022: false
  MD032: false
  MD040: false
  MD012: false
  MD041: false

globs:
  - "**/*.md"
ignores:
  - ".venv/**"
  - "node_modules/**"
  - "frontend/node_modules/**"
  - "backend/data/**"
  # Vendored Anthropic skill documentation.
  - "backend/skills/**"
